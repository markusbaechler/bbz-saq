# CI: Tests und Konsistenzprüfungen bei jedem Push auf main und jedem Pull Request.
# Job «tests»: kein Build-Schritt, keine Abhängigkeiten (Bibliotheken liegen unter lib/); Node 22 wie lokal.
# Job «smoke»: Browser-Smoke-Test mit Playwright/Chromium (tests/smoke, einzige npm-Abhängigkeit, nur Test-Tooling).
# Deployment läuft getrennt über GitHub Pages (Branch main), nicht über diesen Workflow.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Syntax aller ES-Module (auch Views, die der Node-Runner nicht lädt)
        run: |
          set -e
          for f in *.js views/*.js datasource/*.js tools/*.js tests/*.js; do node --check "$f"; done
          echo "Syntax geprüft: $(ls *.js views/*.js datasource/*.js tools/*.js tests/*.js | wc -l) Dateien"

      - name: Tests (tests/run-node.js)
        run: node tests/run-node.js

      - name: README-Glossar aktuell (aus glossary.js erzeugt)
        run: |
          node tools/glossar-readme.js --write
          if ! git diff --quiet -- README.md; then
            echo '::error::README-Glossar veraltet – lokal «node tools/glossar-readme.js --write» ausführen und committen'
            git --no-pager diff -- README.md
            exit 1
          fi

  smoke:
    name: Browser-Smoke-Test (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/smoke/package-lock.json

      - name: Playwright installieren (nur Test-Tooling, die App bleibt ohne Abhängigkeiten)
        working-directory: tests/smoke
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: npm ci

      - name: Chromium-Build zwischenspeichern
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('tests/smoke/package-lock.json') }}

      - name: Chromium und Systembibliotheken
        working-directory: tests/smoke
        run: npx playwright install --with-deps chromium

      - name: Smoke-Test (synthetische Excel, alle Ansichten, Interaktionen)
        run: node tests/smoke/run.mjs

      - name: Screenshots bei Fehler bereitstellen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: tests/smoke/output/
          if-no-files-found: ignore
