<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>bbz Zertifizierungs-Cockpit – Reporting KUBA</title>

</head>
<body>
  <header class="app-header">
    <div class="brand">
      <h1>bbz Zertifizierungs-Cockpit</h1>
      <span class="subtitle">Reporting KUBA</span>
    </div>
    <!-- C1: Datenstand und Statuszeile stehen im Kopf, nicht in einem eigenen Band. Der Volltext in #status bleibt für
         Screenreader (aria-live) und ist bei geladenen Daten nur dort sichtbar; die Datenleiste darunter trägt nur noch
         die zwei Aktionen und erscheint nur im Leerzustand. -->
    <details id="datastand" class="datastand" hidden></details>
    <span id="status" class="status" aria-live="polite">Keine Daten geladen.</span>
    <div class="session">
      <!-- Themenschalter (Paket OPTIK, O3a). Drei Zustaende, weil es ohne «System» innerhalb einer Sitzung keinen
           Weg zurueck zur Systemeinstellung gaebe. Er merkt sich NICHTS: kein localStorage, kein Cookie, keine URL
           – nach dem Neuladen steht er wieder auf System. Native Radios: Tastatur, Rollen und der sichtbare
           Zustand kommen vom Browser, nicht von uns. -->
      <fieldset id="theme-switch" class="theme-switch">
        <legend class="visually-hidden">Darstellung</legend>
        <label><input type="radio" name="theme" value="system" checked> System</label>
        <label><input type="radio" name="theme" value="light"> Hell</label>
        <label><input type="radio" name="theme" value="dark"> Dunkel</label>
      </fieldset>
      <span id="edit-mode-hint" class="edit-mode-hint" hidden>Bearbeitungsmodus: Änderungen schreiben in die Datei</span>
      <button id="btn-edit-mode" type="button" class="secondary edit-mode" aria-pressed="false" hidden>Bearbeiten</button>
      <span id="account" class="account"></span>
      <button id="btn-signin" type="button" hidden>Anmelden</button>
      <button id="btn-signout" type="button" class="secondary" hidden>Abmelden</button>
      <details id="account-menu" class="menu account-menu" hidden>
        <summary id="account-initials" aria-label="Konto"></summary>
        <div class="menu-list" role="group" aria-label="Konto">
          <div id="account-menu-name" class="menu-note"></div>
          <button id="btn-edit-mode-phone" type="button" class="menu-item" hidden>Bearbeiten einschalten</button>
          <button id="btn-signout-phone" type="button" class="menu-item">Abmelden</button>
        </div>
      </details>
    </div>
  </header>

  <section id="databar" class="databar" aria-label="Datenquelle">
    <button id="btn-load" type="button" disabled>Daten von SharePoint laden</button>
    <label class="file-label" title="Excel-Datei lokal prüfen – bleibt im Browser, wird nirgends hochgeladen">
      <span>Lokale Excel-Datei prüfen</span>
      <input id="file-input" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
    </label>
  </section>

  <div id="error" class="error" role="alert" hidden></div>
  <!-- Meldet, wenn der Browser eine alte Fassung aus dem Cache zeigt (siehe tools/version.js). Steht oben und
       nicht in der Fusszeile: Wer alte Zahlen liest, soll es sehen, bevor er sie liest. -->
  <div id="version-hinweis" class="version-hinweis" role="status" hidden></div>

  <nav id="nav" class="views" aria-label="Ansichten"></nav>
  <section id="filterbar" class="filterbar" hidden></section>
  <main id="view" class="view"></main>

  <footer class="app-footer">
    <span>Datenquelle: Reporting_KUBA.xlsx (SharePoint bbz-Zertifizierung). Daten werden nur im Browser-Speicher gehalten.</span>
  </footer>

  <!-- Stylesheet, Bibliotheken (lokal, kein CDN) und Module – alle mit Fassungsmarke gegen alte Dateien aus dem
       Cache. Die Import-Map bildet auch aufgeloeste URLs ab und erreicht damit jedes Modul, ohne dass ein einziger
       import-Aufruf angefasst wird. Erzeugt von tools/version.js, die CI prueft den Stand. -->
<!-- erzeugt von tools/version.js – nicht von Hand ändern -->
  <link rel="stylesheet" href="styles.css?v=a023fe3d12jt2">
  <script type="importmap">
    {
      "imports": {

        "./datasource/index.js": "./datasource/index.js?v=a023fe3d12jt2",

        "./export.js": "./export.js?v=a023fe3d12jt2",
        "./filterChips.js": "./filterChips.js?v=a023fe3d12jt2",
        "./glossary.js": "./glossary.js?v=a023fe3d12jt2",
        "./graph.js": "./graph.js?v=a023fe3d12jt2",
        "./metrics.js": "./metrics.js?v=a023fe3d12jt2",

        "./store.js": "./store.js?v=a023fe3d12jt2",
        "./urlState.js": "./urlState.js?v=a023fe3d12jt2",
        "./version.js": "./version.js?v=a023fe3d12jt2",
        "./views/bankReport.js": "./views/bankReport.js?v=a023fe3d12jt2",
        "./views/chart.js": "./views/chart.js?v=a023fe3d12jt2",
        "./views/common.js": "./views/common.js?v=a023fe3d12jt2",
        "./views/dataQuality.js": "./views/dataQuality.js?v=a023fe3d12jt2",
        "./views/editDialog.js": "./views/editDialog.js?v=a023fe3d12jt2",
        "./views/experten.js": "./views/experten.js?v=a023fe3d12jt2",

  </script>
  <script src="lib/fflate.umd.js?v=a023fe3d12jt2"></script>
  <script src="lib/msal-browser.min.js?v=a023fe3d12jt2"></script>

  <script type="module" src="app.js?v=a023fe3d12jt2"></script>
  <!-- /erzeugt -->
</body>
</html>
